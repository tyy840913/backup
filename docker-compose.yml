name: docker_data

services:
  # Portainer - 容器管理面板
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    network_mode: bridge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9000:9000"

  # Watchtower - 自动更新容器
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: always
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Shanghai
    command: --schedule "0 0 */2 * * *" --cleanup --remove-volumes

  # openlist - 文件列表服务
  openlist:
    image: openlistteam/openlist:latest
    container_name: openlist
    restart: always
    network_mode: bridge
    user: "1001:1001"
    volumes:
      - /docker_data/openlist:/opt/openlist/data
    ports:
      - "5244:5244"
    environment:
      - TZ=Asia/Shanghai
      - UMASK=022

  # Lucky - 反向代理/DDNS 工具
  lucky:
    image: gdy666/lucky:v3
    container_name: lucky
    restart: always
    network_mode: host
    volumes:
      - /docker_data/luckyconf:/app/conf
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Shanghai

  # Vaultwarden - 密码管理服务
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    network_mode: bridge
    volumes:
      - /docker_data/bitwarden:/data
    ports:
      - "8081:80"
    environment:
      - TZ=Asia/Shanghai
      - WEB_VAULT_ENABLED=true
      - SIGNUPS_ALLOWED=true
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 1m
      timeout: 10s
      retries: 3

  # 小雅 alist - 挂载阿里云盘（配置独立管理在 /etc/xiaoya/）
  xiaoya:
    image: xiaoyaliu/alist:latest
    container_name: xiaoya
    restart: always
    network_mode: bridge
    privileged: true
    volumes:
      - /etc/xiaoya:/data
      - /etc/xiaoya/data:/www/data
      - /docker_data/xiaoya:/docker_data/xiaoya
    ports:
      - "2345:2345"
      - "2346:2346"
      - "2347:2347"
      - "5678:80"

  # SearXNG - 元搜索引擎（与 redis 捆绑）
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: always
    network_mode: bridge
    depends_on:
      - searxng-redis
    links:
      - searxng-redis
    ports:
      - "9001:8080"
    volumes:
      - /docker_data/searxng/core-config:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng
    environment:
      - TZ=Asia/Shanghai
      - SEARXNG_BASE_URL=http://localhost:9001
      - SEARXNG_SECRET_KEY=0b58fbfb9f08a8348b6db355a8c59e12d2b8f36248007a5f014fdca1331970c4
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # SearXNG Redis - 搜索引擎缓存
  searxng-redis:
    image: redis:alpine
    container_name: searxng-redis
    restart: always
    network_mode: bridge
    volumes:
      - searxng-redis-data:/data
    command: redis-server

volumes:
  searxng-cache:
  searxng-redis-data:
